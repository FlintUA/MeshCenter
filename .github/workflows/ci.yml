name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Byte-compile all Python sources
        run: python -m compileall -q .

      - name: GPLv3 license-boundary check (meshtastic import stays inside adapters/meshtastic/)
        run: |
          set -e
          # git ls-files, not a filesystem walk: scopes this to tracked
          # sources only, so it can never be polluted by an untracked
          # local scratch/worktree directory (verified: this repo's own
          # .claude/worktrees/ holds pre-Task-48 code with real, now-
          # historical `from meshtastic... import SerialInterface` lines -
          # gitignored, so git ls-files never sees them, but a raw
          # `grep -r .` would have and failed this check on files that
          # were never part of the repo).
          #
          # Anchored to actual import statements (optional leading
          # whitespace, \b word boundary after "meshtastic") - an
          # unanchored substring grep for "import meshtastic"/"from
          # meshtastic" also matches "import meshtastic_transport" (a
          # first-party module name that happens to start with
          # "meshtastic", see meshsrv/meshtastic_transport.py) and dozens
          # of comments/docstrings/test mock class names across this
          # codebase that mention SerialInterface/BLEInterface in prose -
          # verified against the current tree before writing this step:
          # an unanchored version produced ~45 false-positive hits here,
          # none of them a real violation.
          HITS=$(git ls-files -- '*.py' | grep -v "^adapters/meshtastic/" \
              | xargs grep -nE "^\s*(import meshtastic\b|from meshtastic\b)" || true)
          if [ -n "$HITS" ]; then
            echo "GPLv3 boundary violation: meshtastic imported outside adapters/meshtastic/:"
            echo "$HITS"
            exit 1
          fi
          echo "OK - no meshtastic import found outside adapters/meshtastic/"

      - name: Shell script syntax check (bash -n)
        run: |
          set -e
          for script in install.sh meshcenter-firstboot.sh deploy.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
          if [ -d tools ]; then
            find tools -name '*.sh' -print0 | while IFS= read -r -d '' script; do
              echo "bash -n $script"
              bash -n "$script"
            done
          fi
          if [ -d scripts ]; then
            find scripts -name '*.sh' -print0 | while IFS= read -r -d '' script; do
              echo "bash -n $script"
              bash -n "$script"
            done
          fi
          if [ -d installer ]; then
            find installer -name '*.sh' -print0 | while IFS= read -r -d '' script; do
              echo "bash -n $script"
              bash -n "$script"
            done
          fi

      - name: JavaScript syntax check (node --check)
        run: |
          set -e
          # Excludes vendored/minified files, not our code to syntax-check as
          # a regression gate - currently just static/chart.umd.min.js
          # (mirrored from jsdelivr, see its own header comment). Explicit
          # exclude list, not an implicit "skip anything that fails" - if a
          # future first-party file needs excluding too, add it here
          # deliberately rather than letting the loop silently swallow it.
          EXCLUDE="static/chart.umd.min.js"
          for script in static/*.js; do
            if [ "$script" = "$EXCLUDE" ]; then
              echo "skip (vendored) $script"
              continue
            fi
            echo "node --check $script"
            node --check "$script"
          done

      - name: i18n catalog consistency check
        run: python scripts/check-i18n.py

      - name: server.py startup-call regression check
        run: python scripts/check_startup_calls.py

      - name: Run pytest
        run: python -m pytest

  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Builds both release archives (Core, MIT; Meshtastic adapter,
      # GPLv3) and smoke-tests each one (extract -> clean venv -> install
      # -> import -> health-check) - see scripts/build-release.sh's own
      # docstring for why this runs on every PR/push to main, not just at
      # release time: a whitelist or dependency-closure regression should
      # fail CI immediately, not surface the next time someone actually
      # cuts a release.
      - name: Build and smoke-test both release archives
        run: scripts/build-release.sh

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*.tar.gz
          retention-days: 14
