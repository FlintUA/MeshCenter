name: Attach installer to release

on:
  release:
    types: [published]

jobs:
  attach-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload installer scripts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firstrun.sh
            meshcenter-firstboot.sh
