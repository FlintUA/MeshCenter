[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    benchmark: measures timing/memory for a hardware-sensitive operation - correctness-asserting and safe to run in CI, but the numbers that matter for docs/architecture/ADR-0002-crypto-suite.md come from a manual run on the real dev/prod Pi hardware (python -m pytest -m benchmark -v -s), not this run's.
